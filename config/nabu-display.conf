# Xiaomi Pad 5 (nabu) display.
#
# The NT36523 panel and the KTZ8866 backlight are modules on purpose (see
# nabu-display.config): built in, the panel probes during the very first DSI
# power-on while the controller still holds the bootloader's video-mode state,
# which used to break the panel bring-up.  As modules they probe after the
# display core has settled.
#
# They must nevertheless be *loaded* before the msm DRM driver registers its
# framebuffer, otherwise the kernel has no connector yet when it tears down the
# bootloader's efifb.  The console then falls back to the dummy device (black
# screen) until udev gets around to loading the panel, so the boot log is
# missing for that window.  Loading both modules via modules-load.d (an early
# sysinit step, well before msm's deferred probe) lets the panel attach as
# soon as the DSI host appears, so msmdrmfb takes over in the same step that
# removes efifb and the boot log keeps scrolling.
#
# Order matters: the panel asks for the KTZ8866 backlight (DT `backlight =
# <&backlight>`), so the backlight driver must be registered first.
ktz8866
panel-novatek-nt36523
