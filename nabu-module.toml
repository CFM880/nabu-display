schema = 1

[module]
name        = "nabu-display"
description = "SM8150 DPU/DSI display support, NT36523 panel and DRM notifier"
requires    = []

[provides]
# On 6.18.y the overlay only carries drm_notifier.[ch]: upstream has neither and
# the touch driver needs them.  The old 6.14 snapshots (DPU/DSI/panel/catalogs,
# dispcc) are gone - copying them over 6.18 is what broke the build.  They are
# still on `main` for the 6.14 line.
overlay = "kernel-overlay"
# 6.18.y only: upstream dropped wb2_formats_rgb[] but kept its users, which
# breaks the build when DRM_MSM is built in (our config does).  The -6.14.skip
# marker keeps 6.14 untouched.
patches = ["patches/0001-drm-msm-wb2-formats.patch",
           "patches/0002-drm-notifier.patch",
           "patches/0003-dpu-cold-start.patch",
           "patches/0004-dsi-pre-on-diag.patch"]
config  = ["config/nabu-display.config"]

# Display support is built into the kernel (CONFIG_DRM_MSM=y and
# CONFIG_DRM_PANEL_NOVATEK_NT36523=y), so this module contributes no .ko of its
# own; it only carries the source overlay and the config fragment.
